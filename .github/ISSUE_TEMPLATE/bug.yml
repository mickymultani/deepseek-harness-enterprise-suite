name: Bug report
description: Report reproducible incorrect behavior without disclosing sensitive data.
title: '[Bug]: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, proprietary tenant content, personal data, or exploitable security details. Report vulnerabilities according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Suite version or commit
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: DeepSeek Harness version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Connector mode
      options:
        - Mock
        - Live
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include a minimal, sanitized reproduction and relevant redacted logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, tenant content, personal data, and other sensitive information.
          required: true
