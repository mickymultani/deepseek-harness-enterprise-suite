name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm pack --pack-destination artifacts
      - run: shasum -a 256 artifacts/*.tgz > artifacts/SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
